name: buildAndroid 0.8.8 ANIMANIA 3 PARTS
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: JOIN 3 ZIPs + Unzip Animania
        run: |
          ls -lh mods/
          # Si son .001 .002 .003 los junta en un solo zip
          if ls mods/*.001 1>/dev/null 2>&1; then
            echo "Juntando partes .001 .002 .003..."
            cat mods/*.001 mods/*.002 mods/*.003 > mods/Animania.zip 2>/dev/null || cat mods/Animania.zip.* > mods/Animania.zip
          fi
          # Si son part1 part2 part3 tambien los junta
          if ls mods/*part*.zip 1>/dev/null 2>&1; then
            echo "Juntando partes part1 part2 part3..."
            # por si son zips separados con carpetas adentro, solo los descomprimimos todos
            for f in mods/*.zip; do unzip -o "$f" -d mods/ || true; done
          else
            unzip -o mods/Animania.zip -d mods/ || true
          fi
          rm -f mods/*.zip mods/*.001 mods/*.002 mods/*.003
          ls -R mods/ | head -n 100

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3

      - name: Install hmm
        run: |
          haxelib setup /home/runner/haxelib
          haxelib --global install hmm --quiet
          haxelib --global run hmm setup
          hmm install

      - name: FIX lime.ndll
        run: |
          haxelib run lime rebuild linux -release
          haxelib run lime rebuild tools -release

      - name: Setup Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_ROOT
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime rebuild hxcpp -clean

      - name: Build APK
        run: haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Animania-3PARTS-APK
          path: export/release/android/bin/app/build/outputs/apk/debug
