name: buildAndroid
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3
      - name: Install Haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.2.0
          haxelib install openfl 9.4.0
          haxelib install flixel 5.8.0
          haxelib git flixel-addons https://github.com/HaxeFlixel/flixel-addons
          haxelib install flixel-ui
          haxelib install hscript
          haxelib install hxcpp 4.3.2
          haxelib list
      - name: Fix lime
        run: |
          haxelib run lime setup
          haxelib run lime rebuild tools
          haxelib run lime rebuild hxcpp -m64
          haxelib run lime rebuild android
      - name: Build
        run: haxelib run lime build android -final
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FunkinAPK
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk
