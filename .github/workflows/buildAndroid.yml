name: buildAndroid 0.8.8 FIX ZIP MOD
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Unzip Mods Animania
        run: |
          for zip in mods/*.zip mods/**/*.zip; do [ -f "$zip" ] && unzip -o "$zip" -d mods/ && rm "$zip"; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3

      - name: Install hmm
        run: |
          haxelib setup /home/runner/haxelib
          haxelib --global install hmm --quiet
          haxelib --global run hmm setup
          hmm install

      - name: FIX lime.ndll
        run: |
          haxelib run lime rebuild linux -release
          haxelib run lime rebuild tools -release

      - name: Setup Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_ROOT
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime rebuild hxcpp -clean

      - name: Build APK
        run: haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Animania-APK
          path: export/release/android/bin/app/build/outputs/apk/debug
