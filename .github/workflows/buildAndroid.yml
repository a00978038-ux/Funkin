name: buildAndroid Original 0.8.8
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3
      - name: Install hmm + Funkin libs
        run: |
          haxelib setup /home/runner/haxelib
          haxelib --global install hmm --quiet
          haxelib --global run hmm setup
          haxelib --global git haxelib https://github.com/FunkinCrew/haxelib.git --quiet
          haxelib --global git hmm https://github.com/FunkinCrew/hmm.git --quiet
          hmm install --quiet
          haxelib list
      - name: Setup Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime rebuild tools -clean
      - name: Build APK Original
        run: haxelib run lime build android -final
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-0.8.8-Original-APK
          path: export/release/android/bin/app/build/outputs/apk/debug
