
name: buildAndroid 0.8.7 ANIMANIA 3 PARTS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ==========================================
      # JOIN 3 ZIPs + UNZIP ANIMANIA
      # ==========================================
      - name: JOIN 3 ZIPs + Unzip Animania
        shell: bash
        run: |
          set -e
          mkdir -p mods
          shopt -s nullglob

          echo "Archivos de Animania:"
          ls -lah mods/

          # Unir archivos .001 .002 .003
          PARTS=(mods/*.001)

          if [ ${#PARTS[@]} -gt 0 ]; then
            PREFIX="${PARTS[0]%.001}"

            for EXT in 001 002 003; do
              if [ ! -f "${PREFIX}.${EXT}" ]; then
                echo "ERROR: Falta ${PREFIX}.${EXT}"
                exit 1
              fi
            done

            cat "${PREFIX}.001" \
                "${PREFIX}.002" \
                "${PREFIX}.003" > mods/Animania.zip

            unzip -tq mods/Animania.zip
          fi

          # Extraer ZIPs normales o partes independientes
          ZIP_FILES=(mods/*.zip)

          if [ ${#ZIP_FILES[@]} -eq 0 ]; then
            echo "No se encontraron ZIPs para extraer."
          else
            for FILE in "${ZIP_FILES[@]}"; do
              echo "Extrayendo $FILE"
              unzip -o "$FILE" -d mods/
            done
          fi

          echo "Contenido extraído:"
          find mods -maxdepth 4 -type f | head -n 150

          # Eliminar comprimidos después de extraer
          rm -f mods/*.zip
          rm -f mods/*.001 mods/*.002 mods/*.003

      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # ANDROID NDK OFICIAL RECOMENDADO
      # ==========================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-29" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13113456"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"

      # ==========================================
      # HAXE
      # ==========================================
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.3'

      # ==========================================
      # HMM + DEPENDENCIES
      # ==========================================
      - name: Install HMM and dependencies
        shell: bash
        run: |
          set -e

          haxelib setup /home/runner/haxelib

          haxelib --global install hmm --quiet
          haxelib --global run hmm setup

          hmm install

      # ==========================================
      # LIME
      # ==========================================
      - name: Setup Lime
        shell: bash
        run: |
          set -e

          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

          haxelib run lime setup -alias -y

      # ==========================================
      # BUILD ANDROID
      # ==========================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          haxelib run lime test android

          echo "Buscando APK..."

          find export -type f -name "*.apk" -print

          APK_COUNT=$(find export -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No se encontró ningún APK."
            exit 1
          fi

      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-0.8.7-Animania-APK
          path: export/**/*.apk
          if-no-files-found: error
          retention-days: 7
          
