
      # ==========================================
      # INSTALL LINUX BUILD DEPENDENCIES
      # ==========================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            g++ \
            gcc \
            g++-multilib \
            gcc-multilib \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libpulse-dev

      # ==========================================
      # FIX FUNKIN LIME NDLL
      # ==========================================
      - name: FIX lime.ndll
        shell: bash
        run: |
          set -e

          echo "Reinstalando Lime de Funkin..."

          hmm reinstall -f lime

          echo "Reconstruyendo Lime para Linux 64 bits..."

          haxelib run lime rebuild cpp -64 -release -clean

          echo "Comprobando biblioteca..."

          find .haxelib -iname "lime.ndll" -print || true
          
