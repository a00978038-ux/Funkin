name: buildAndroid
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3
      - name: Install Libs
        run: |
          haxelib setup /home/runner/haxelib
          haxelib install lime 8.2.0 --quiet
          haxelib install openfl 9.4.0 --quiet
          haxelib install flixel 5.8.0 --quiet
          haxelib git flixel-addons https://github.com/HaxeFlixel/flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib install format --quiet
      - name: Rebuild
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime rebuild tools
      - name: Build APK
        run: haxelib run lime build android -final
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FunkinAPK
          path: export/release/android/bin/app/build/outputs/apk/debug
