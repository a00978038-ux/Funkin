name: Build Oficial
on: workflow_dispatch
jobs:
  buildAndroid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3
      - name: Install Haxelib
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib git hscript https://github.com/HaxeFoundation/hscript.git
          haxelib install hxcpp
          haxelib install extension-androidtools
          haxelib install hxCodec
          haxelib git linc_luajit https://github.com/Sirox228/linc_luajit.git
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate
          haxelib git hmp https://github.com/ShadowMario/HMP
          haxelib install polymod
          haxelib install actuate
          haxelib install hxvlc
          haxelib list
      - name: Setup Lime
        run: |
          haxelib run lime setup flixel
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
      - name: Compile
        run: haxelib run lime build android -final
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Animania-APK
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk
