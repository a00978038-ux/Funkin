name: Build Oficial
on: workflow_dispatch
jobs:
  buildAndroid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3
      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install lime --always || true
          haxelib install openfl --always || true
          haxelib install flixel --always || true
          haxelib install flixel-addons --always || true
          haxelib install flixel-ui --always || true
          haxelib git hscript https://github.com/HaxeFoundation/hscript
          haxelib install hxcpp --always || true
          haxelib git extension-androidtools https://github.com/openfl/extension-androidtools || true
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec || haxelib install hxCodec --always || true
          haxelib git linc_luajit https://github.com/Sirox228/linc_luajit
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate
          haxelib git hmp https://github.com/ShadowMario/HMP
          haxelib install polymod --always || true
          haxelib install actuate --always || true
          haxelib install hxvlc --always || haxelib git hxvlc https://github.com/MasterEric/hxvlc || true
          haxelib list
      - name: Setup Lime
        run: |
          haxelib run lime setup flixel
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
      - name: Compile
        run: haxelib run lime build android -final
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Animania-APK
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk
