name: Build Oficial
on: workflow_dispatch
jobs:
  buildAndroid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3
      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install lime --always
          haxelib install openfl --always
          haxelib install flixel --always
          haxelib install flixel-addons --always
          haxelib install flixel-ui --always
          haxelib install hscript --always
          haxelib install hxcpp --always
          haxelib install polymod --always
          haxelib install actuate --always
          haxelib install hxCodec --always
          haxelib git linc_luajit https://github.com/Sirox228/linc_luajit.git --always
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate --always
          haxelib git hmp https://github.com/ShadowMario/HMP --always
          haxelib install extension-androidtools --always
          haxelib install hxvlc --always
          haxelib run lime setup -y
          haxelib run lime setup flixel -y
      - name: Setup Lime
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
      - name: Compile
        run: haxelib run lime build android -final
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Animania-APK
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk
