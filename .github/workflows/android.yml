name: Build Oficial
on: workflow_dispatch
jobs:
  buildAndroid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3
      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib --always > /dev/null
          haxelib install lime --quiet > /dev/null 2>&1 || true
          haxelib install openfl --quiet > /dev/null 2>&1 || true
          haxelib install flixel --quiet > /dev/null 2>&1 || true
          haxelib install flixel-addons --quiet > /dev/null 2>&1 || true
          haxelib install flixel-ui --quiet > /dev/null 2>&1 || true
          haxelib install hscript --quiet > /dev/null 2>&1 || true
          haxelib install hxcpp 4.3.2 --quiet > /dev/null 2>&1 || true
          haxelib install polymod --quiet > /dev/null 2>&1 || true
          haxelib install actuate --quiet > /dev/null 2>&1 || true
          haxelib git linc_luajit https://github.com/Sirox228/linc_luajit --quiet > /dev/null 2>&1 || true
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate --quiet > /dev/null 2>&1 || true
          haxelib git hmp https://github.com/ShadowMario/HMP --quiet > /dev/null 2>&1 || true
          echo "Librerias instaladas:"
          haxelib list
      - name: Setup Lime
        run: |
          haxelib run lime setup flixel --always > /dev/null 2>&1 || true
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
      - name: Compile
        run: haxelib run lime build android -final
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animania-APK
          path: export/release/android/bin/app/build/outputs/apk/debug
