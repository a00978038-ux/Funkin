name: Build Animania 0.6 APK SOLO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install Haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.2.2 --quiet
          haxelib install openfl 9.4.1 --quiet
          haxelib install flixel 5.8.0 --quiet
          haxelib install flixel-addons 3.2.2 --quiet
          haxelib install flixel-ui 2.6.1 --quiet
          haxelib install hscript 2.5.0 --quiet
          haxelib install hxCodec 3.2.1 --quiet
          haxelib git hxcpp https://github.com/mcagabe19-stuff/hxcpp.git --quiet
          haxelib git linc_luajit https://github.com/Sirox228/linc_luajit --quiet
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate.git --quiet
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools --quiet
          haxelib list

      - name: Setup Lime
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime update -y

      - name: Build APK
        run: haxelib run lime build android -final -D officialBuild

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animania-0.6-SOLO-MOD
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
