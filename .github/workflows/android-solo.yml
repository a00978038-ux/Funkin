name: Build Animania SOLO - FINAL SIN ERRORES
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5
      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
      - name: Install Haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install lime --always
          haxelib install openfl --always
          haxelib install flixel --always
          haxelib install flixel-addons --always
          haxelib install flixel-ui --always
          haxelib install hscript --always
          haxelib install hxcpp --always
          haxelib install actuate --always
          haxelib install polymod --always
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec
          haxelib git hmp https://github.com/ShadowMario/HMP
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate
          haxelib git linc_luajit https://github.com/Sirox228/linc_luajit
          haxelib git hxvlc https://github.com/MAJigsaw77/hxvlc
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools
      - name: Setup Lime
        run: |
          haxelib run lime setup -y
          haxelib run lime setup android -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_ROOT
      - name: Change package
        run: |
          FILE=$(find . -name "Project.xml" | head -1)
          sed -i 's/package="[^"]*"/package="com.animania.solomod"/g' "$FILE"
      - name: Build APK
        run: haxelib run lime build android -final --app-version "0.6-SOLO"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animania-SOLO-APK
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk
