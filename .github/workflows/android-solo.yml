name: Build Animania 0.6 APK - SOLO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Change Package to SOLO
        run: |
          if [ -f export_presets.cfg ]; then
            sed -i 's/package\/unique_name="[^"]*"/package\/unique_name="com.animania.solomod"/' export_presets.cfg || true
            sed -i 's/application\/name="[^"]*"/application\/name="Animania Solo"/' export_presets.cfg || true
            sed -i 's/name="[^"]*"/name="Animania Solo"/' export_presets.cfg || true
            echo "Package changed for SOLO build"
            cat export_presets.cfg | grep -A2 -B2 unique_name || true
          fi

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3
          use-dotnet: false
          include-templates: true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/Animania-Solo.apk || godot --headless --export "Android" build/Animania-Solo.apk
          ls -lh build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animania-0.6-APK-SOLO
          path: build/*.apk
