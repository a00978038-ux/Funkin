name: Build Animania 0.6 APK - SOLO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Haxe 4.3.6
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install Haxelibs from Project.xml
        run: |
          haxelib setup ~/haxelib
          # instala base
          haxelib install lime --always || true
          haxelib install openfl --always || true
          haxelib install flixel --always || true
          haxelib install hxcpp --always || true
          # lee todas las librerias que pide tu Project.xml e instalalas
          FILE=$(find . -name "Project.xml" | head -1)
          echo "Project: $FILE"
          cat "$FILE" | grep haxelib | grep -o 'name="[^"]*"' | cut -d'"' -f2 | while read lib; do
            echo "Installing $lib"
            haxelib install "$lib" --always || haxelib git "$lib" "https://github.com/search?q=$lib" --always || true
          done
          # extras que siempre piden los FNF mods
          haxelib install hmp --always || true
          haxelib install hxCodec --always || true
          haxelib install flxanimate --always || true
          haxelib install linc_luajit --always || true
          haxelib install extension-androidtools --always || true
          haxelib list
          haxelib run lime setup -y
          haxelib run lime setup android -y

      - name: Change Package Name
        run: |
          FILE=$(find . -name "Project.xml" | head -1)
          sed -i 's/package="[^"]*"/package="com.animania.solomod"/' "$FILE" || true

      - name: Build APK
        run: |
          haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animania-0.6-SOLO-APK
          path: |
            export/release/android/bin/app/build/outputs/apk/debug/*.apk
            export/release/android/bin/*.apk
            export/**/*.apk
