name: Build Animania 0.6 APK - SOLO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      - name: Set up Haxe 4.3.6
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install Haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hscript
          haxelib install hxcpp
          haxelib install extension-androidtools
          haxelib run lime setup -y

      - name: Change Package Name
        run: |
          sed -i 's/<app file=".*"/<app file="AnimaniaSOLO" package="com.animania.solomod" /' Project.xml || true
          cat Project.xml | grep package

      - name: Setup Lime
        run: |
          haxelib run lime setup android -y || true
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_SDK_ROOT/ndk-bundle || true

      - name: Build APK
        run: |
          haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animania-0.6-SOLO-APK
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk
