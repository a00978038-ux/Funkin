name: Build Animania 0.6 APK - SOLO MOD
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3
          use-dotnet: false
          include-templates: true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/Animania.apk || godot --headless --export "Android" build/Animania.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animania-0.6-APK-SOLO
          path: build/*.apk
