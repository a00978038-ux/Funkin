name: Build Animania 0.6 APK - SOLO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Haxe 4.3.6
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install Haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install lime --always
          haxelib install openfl --always
          haxelib install flixel --always
          haxelib install flixel-addons --always
          haxelib install flixel-ui --always
          haxelib install hscript --always
          haxelib install hxcpp --always
          haxelib install extension-androidtools --always
          haxelib run lime setup -y
          haxelib run lime setup android -y

      - name: Find and Change Package Name
        run: |
          echo "Archivos en la raiz:"
          ls -la
          echo "Buscando Project.xml:"
          find . -name "Project.xml" -o -name "project.xml" | head -20
          FILE=$(find . -name "Project.xml" -o -name "project.xml" | head -1)
          echo "Archivo encontrado: $FILE"
          if [ -n "$FILE" ]; then
            sed -i 's/package="[^"]*"/package="com.animania.solomod"/' "$FILE" || true
            sed -i 's/<app file="[^"]*"/<app file="AnimaniaSOLO"/' "$FILE" || true
            grep -o 'package="[^"]*"' "$FILE"
          else
            echo "No se encontro Project.xml, continuamos con package por defecto"
          fi

      - name: Build APK
        run: |
          haxelib run lime build android -final -verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animania-0.6-SOLO-APK
          path: |
            export/release/android/bin/app/build/outputs/apk/debug/*.apk
            export/release/android/bin/*.apk
            export/**/*.apk
