name: Build Oficial

on: workflow_dispatch

jobs:
  buildAndroid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Restore Cache Haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-cache-${{ hashFiles('Project.xml') }}
          restore-keys: haxelib-cache-

      - name: Setup Lime
        run: |
          haxelib setup ~/haxelib
          haxelib install lime --always
          haxelib install openfl --always
          haxelib install flixel --always
          haxelib install hxp --always
          haxelib install hxcpp --always
          haxelib run lime setup

      - name: Compile
        run: haxelib run lime build android -final

      - name: Post Cache Haxelib
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/haxelib
          key: haxelib-cache-${{ hashFiles('Project.xml') }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-OFICIAL
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
